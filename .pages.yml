# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Pages CMS (https://app.pagescms.org): editor for people without a GitHub account.
media:
  input: "public/media/uploads"
  output: "/media/uploads"
  rename: "safe"
  categories:
    - "image"
    - "document"
settings:
  commit:
    identity: "user"
content:
