    label: "Next gala: date, venue & dress code"
    type: "file"
    path: "src/content/event.json"
    format: "json"
    description: "Set the date (YYYY-MM-DD) and the countdown appears on the home page automatically. Leave the date empty to show \"Date to be announced\"."
    fields:
      - name: "editionLabel"
        label: "Title of the next gala"
        type: "string"
      - name: "date"
        label: "Gala date"
        description: "Leave empty until the date is confirmed."
        type: "date"
      - name: "dateText"
        label: "Text shown when there is no date yet"
        type: "string"
      - name: "time"
        label: "Time"
        type: "string"
      - name: "dressCode"
        label: "Dress code"
        type: "string"
      - name: "venueName"
        label: "Venue name"
        type: "string"
      - name: "venueAddress"
        label: "Venue address"
        type: "string"
      - name: "note"
        label: "Note for guests"
        type: "text"
      - name: "lastEdition"
        label: "Last gala (shown under the date)"
        type: "object"
        fields:
