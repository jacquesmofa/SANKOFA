name: endpoint check (temporary)
on:
  push:
    branches: [tools-contact-sheet]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in admin/ admin/config.yml api/auth.php gallery/gala-2025 favicon.svg media/uploads/; do
            printf '%s -> ' "$u"; curl -s -o /tmp/b -w '%{http_code}\n' "https://sankofaroyaleaward.ca/$u"; head -c 160 /tmp/b | tr '\n' ' '; echo; done
          printf 'http -> '; curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://sankofaroyaleaward.ca/
          printf 'www -> '; curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' https://www.sankofaroyaleaward.ca/
