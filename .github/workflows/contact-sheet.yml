name: screenshots (temporary)
on:
  push:
    branches: [tools-contact-sheet]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: mkdir -p shots && python .tools/shots.py https://sankofaroyaleaward.ca/preview/
      - run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          for f in shots/d_*.jpg; do mogrify -resize 900x -quality 62 "$f"; done
          git config user.name ci; git config user.email ci@example.com
          git add shots && git commit -qm "shots [skip ci]" && git push -q
